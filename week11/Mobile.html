<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/headerfooter.css">
    <link rel="stylesheet" href="css/menu.css">

</head>

<body>

    <div class="header">

        <div class="logo">
            <img src="image/logo.png" alt="logo">

        </div>

        <div class="menu">
            <div>Home</div>
            <div>Menu</div>
            <div>Order</div>
            <div>Promotion</div>

            <div>Our Restaurant</div>
        </div>

        <div class="order">

        </div>

        <div class="hamburger">
            <img src=" image/hamburger.png" alt="hamburger">
        </div>

    </div>

    <div class="main">

        <div class="right">
            <img src="image/mobile.png" alt="right">
        </div>

        <div class="left">

            <div class="small-title">
                FIND DINING Experience

            <div class="title">

    <script src="js/menu.js"></script>
